<dialog
  class="gallery-dialog"
  id="gallery-dialog"
  aria-labelledby="gallery-dialog-title"
>
  <div class="gallery-dialog-frame">
    <button class="gallery-close" type="button" aria-label="Close gallery">
      ×
    </button>
    <button
      class="gallery-nav gallery-prev"
      type="button"
      aria-label="Previous photo"
    >
      ‹
    </button>
    <figure class="gallery-dialog-figure">
      <img
        id="gallery-dialog-image"
        src="/images/gallery/Gambody-BD-1-lifesized.webp"
        alt="Life-sized 3D printed BD-1 droid model"
        width="750"
        height="1000"
        loading="lazy"
      />
      <figcaption id="gallery-dialog-title"></figcaption>
    </figure>
    <button
      class="gallery-nav gallery-next"
      type="button"
      aria-label="Next photo"
    >
      ›
    </button>
  </div>
</dialog>

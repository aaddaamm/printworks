<section
  id="timelapses"
  class="section timelapses"
  aria-labelledby="timelapses-heading"
>
  <div class="section-heading">
    <p class="eyebrow">Prints in motion</p>
    <h2 id="timelapses-heading">From first layer to finished print.</h2>
    <p>
      A closer look at six character and creature prints taking shape, one layer
      at a time.
    </p>
  </div>
  <div class="timelapse-grid">
    <figure class="timelapse-card">
      <video
        controls
        preload="none"
        playsinline
        poster="/images/timelapses/iron-man.jpg"
        width="1280"
        height="720"
        aria-label="Play the Iron Man helmet print time-lapse"
      >
        <source src="/images/timelapses/iron-man.mp4" type="video/mp4" />
        Your browser does not support embedded video.
      </video>
      <figcaption>
        <strong>Iron Man figure</strong>
        <span>Print time-lapse</span>
      </figcaption>
    </figure>
    <figure class="timelapse-card">
      <video
        controls
        preload="none"
        playsinline
        poster="/images/timelapses/tropical-frogs.jpg"
        width="1280"
        height="720"
        aria-label="Play the tropical frogs print time-lapse"
      >
        <source src="/images/timelapses/tropical-frogs.mp4" type="video/mp4" />
        Your browser does not support embedded video.
      </video>
      <figcaption>
        <strong>Tropical frogs</strong>
        <span>Small-batch print time-lapse</span>
      </figcaption>
    </figure>
    <figure class="timelapse-card">
      <video
        controls
        preload="none"
        playsinline
        poster="/images/timelapses/fennekin.jpg"
        width="1280"
        height="720"
        aria-label="Play the Fennekin print time-lapse"
      >
        <source src="/images/timelapses/fennekin.mp4" type="video/mp4" />
        Your browser does not support embedded video.
      </video>
      <figcaption>
        <strong>Fennekin</strong>
        <span>Print time-lapse</span>
      </figcaption>
    </figure>
    <figure class="timelapse-card">
      <video
        controls
        preload="none"
        playsinline
        poster="/images/timelapses/robocop.jpg"
        width="1280"
        height="720"
        aria-label="Play the RoboCop bust print time-lapse"
      >
        <source src="/images/timelapses/robocop.mp4" type="video/mp4" />
        Your browser does not support embedded video.
      </video>
      <figcaption>
        <strong>RoboCop</strong>
        <span>Print time-lapse</span>
      </figcaption>
    </figure>
    <figure class="timelapse-card">
      <video
        controls
        preload="none"
        playsinline
        poster="/images/timelapses/world-weary-little-owl.jpg"
        width="1280"
        height="720"
        aria-label="Play the world-weary little owl print time-lapse"
      >
        <source
          src="/images/timelapses/world-weary-little-owl.mp4"
          type="video/mp4"
        />
        Your browser does not support embedded video.
      </video>
      <figcaption>
        <strong>World-weary little owl</strong>
        <span>Print time-lapse</span>
      </figcaption>
    </figure>
    <figure class="timelapse-card">
      <video
        controls
        preload="none"
        playsinline
        poster="/images/timelapses/butterfly-dragon.jpg"
        width="1280"
        height="720"
        aria-label="Play the butterfly dragon print time-lapse"
      >
        <source
          src="/images/timelapses/butterfly-dragon.mp4"
          type="video/mp4"
        />
        Your browser does not support embedded video.
      </video>
      <figcaption>
        <strong>Butterfly dragon</strong>
        <span>Print time-lapse</span>
      </figcaption>
    </figure>
  </div>
</section>

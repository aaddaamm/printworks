<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Robinson PrintWorks local 3D printing ad</title>
  <desc id="desc">Square navy and cyan graphic promoting local 3D printing for useful fixes.</desc>

  <rect width="1200" height="1200" fill="#061B33" />
  <circle cx="1080" cy="105" r="520" fill="#0B4059" opacity="0.78" />
  <circle cx="1070" cy="1110" r="520" fill="#0B4059" opacity="0.78" />

  <rect x="428" y="72" width="344" height="344" rx="54" fill="#F8FAFC" stroke="#22D3EE" stroke-width="8" />
  <image href="../../logo-printer-transparent.png" xlink:href="../../logo-printer-transparent.png" x="452" y="96" width="296" height="296" preserveAspectRatio="xMidYMid meet" />

  <g font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-weight="800" text-anchor="middle">
    <text x="600" y="540" font-size="64" fill="#F8FAFC">Local 3D printing</text>
    <text x="600" y="620" font-size="64" fill="#22D3EE">for useful fixes.</text>
  </g>

  <g font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-weight="700" text-anchor="middle" fill="#F8FAFC">
    <text x="600" y="745" font-size="34">Replacement parts • prototypes</text>
    <text x="600" y="800" font-size="34">gifts • small batches</text>
  </g>

  <text x="600" y="885" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="30" font-weight="700" text-anchor="middle" fill="#94A3B8">Rhode Island pickup available</text>

  <rect x="320" y="962" width="560" height="96" rx="30" fill="#22D3EE" />
  <text x="600" y="1024" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="34" font-weight="800" text-anchor="middle" fill="#061B33">Robinson PrintWorks</text>
</svg>
